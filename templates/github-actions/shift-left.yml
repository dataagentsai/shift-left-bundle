# Pull-request checks (< 5 min). Not yet run (2 Nov 2026); Tier 7 task SL-072 verifies it.
name: shift-left
on: [pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                    # diff-cover needs the base branch
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-test.txt pre-commit diff-cover
      - run: pip install "shiftleft[tools] @ git+https://github.com/dataagentsai/shift-left-bundle"
      - run: shiftleft scan . --stage pr --sarif shiftleft.sarif --summary pr-comment.md --html health.html
        continue-on-error: true
        id: shiftleft
      - uses: github/codeql-action/upload-sarif@v3          # findings on the changed lines
        with: { sarif_file: shiftleft.sarif }
      - uses: actions/upload-artifact@v4                     # the repo health page (D9 level 2)
        with: { name: shiftleft-health, path: health.html }
      - run: gh pr comment ${{ github.event.pull_request.number }} --body-file pr-comment.md --edit-last || gh pr comment ${{ github.event.pull_request.number }} --body-file pr-comment.md
        env: { GH_TOKEN: "${{ github.token }}" }             # needs permissions: pull-requests: write
      - run: test "${{ steps.shiftleft.outcome }}" = "success"   # fail the job if anything new blocks
      - run: pytest -q --cov --cov-branch --cov-report=xml
      - run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
