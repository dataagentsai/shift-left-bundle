# Pull-request checks for Azure DevOps. Not yet run (2 Nov 2026); Tier 7 task SL-072 verifies it.
trigger: none
pr: [main]
pool: { vmImage: ubuntu-latest }
steps:
  - checkout: self
    fetchDepth: 0
  - task: JavaToolInstaller@0
    inputs: { versionSpec: "17", jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
  - task: UsePythonVersion@0
    inputs: { versionSpec: "3.11" }
  - script: pip install -r requirements-test.txt pre-commit diff-cover
  - script: pip install "shiftleft[tools] @ git+https://github.com/dataagentsai/shift-left-bundle"
  - script: shiftleft scan . --stage pr --sarif shiftleft.sarif --summary pr-comment.md --html health.html
  - task: PublishBuildArtifacts@1          # SARIF shows in the "Scans" tab with the SARIF SAST Scans Tab extension
    condition: always()
    inputs: { pathToPublish: shiftleft.sarif, artifactName: CodeAnalysisLogs }
  - task: PublishBuildArtifacts@1          # the repo health page (D9 level 2)
    condition: always()
    inputs: { pathToPublish: health.html, artifactName: shiftleft-health }
  - script: pytest -q --cov --cov-branch --cov-report=xml
  - script: diff-cover coverage.xml --compare-branch=origin/$(System.PullRequest.TargetBranchName) --fail-under=80
