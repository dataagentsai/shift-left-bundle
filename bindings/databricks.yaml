# Databricks binding v0 (SL-015). The only place product and tool names appear.
# Platform: Databricks on PySpark 3.5, Python 3.11, Databricks SQL, Asset Bundles (databricks.yml).
# applies_to on this platform: notebook = .ipynb and source-format .py (# COMMAND / # MAGIC); sql = .sql files,
# %sql and MAGIC %sql cells, spark.sql("...") strings (extracted by costlens inputs/); dbt = dbt-databricks projects;
# metric-view = CREATE VIEW ... WITH METRICS LANGUAGE YAML; materialized-view = Databricks SQL and pipeline MVs;
# bundle-config = databricks.yml and resources/*.yml.
#
# Every check in catalog/ has an entry. Fields:
#   tool:   the adapter that finds it (see `tools` below)
#   rules:  the tool's own rule ids
#   status: adopt   = an off-the-shelf rule exists; we only configure it
#           cost    = an existing rule in the cost adapter (costlens-core, optional until published, D2)
#           build   = we write the rule or plugin (an Opengrep rule, a sqlglot rule, a repo-review plugin)
#           trial   = a candidate tool, to be scored on the sample repo before adopting
#   note:   anything a reader needs

tools:
  ruff: {licence: MIT, kind: python lint, format and security}
  complexipy: {licence: MIT, kind: cognitive complexity}
  vulture: {licence: MIT, kind: dead code}
  pylint: {licence: GPL-2.0 (tool only, not linked), kind: duplicate code}
  opengrep: {licence: LGPL-2.1, kind: pattern rules (our own rules only)}
  sqlfluff: {licence: MIT, kind: SQL lint and format, dialect databricks}
  sqlglot: {licence: MIT, kind: SQL syntax tree for our own rules}
  gitleaks: {licence: MIT, kind: secrets in files and history}
  pip-audit: {licence: Apache-2.0, kind: known vulnerabilities, Python only; fallback}
  osv-scanner: {licence: Apache-2.0, kind: known vulnerabilities from lockfiles, OSV database (the one OpenSSF Scorecard uses)}
  nbstripout: {licence: MIT, kind: strips notebook outputs on commit}
  dbt-bouncer: {licence: MIT, kind: rules over dbt manifest.json from dbt parse (offline)}
  dbt-score: {licence: MIT, kind: scores dbt model metadata (offline)}
  dbt-project-evaluator: {licence: Apache-2.0, kind: dbt Labs DAG best-practice rules; 1.x builds in the warehouse, so trial only}
  mv-explain: {licence: Databricks SQL, kind: EXPLAIN CREATE MATERIALIZED VIEW on a dev warehouse (Runtime 17.3+), pre-deploy}
  metricview: {licence: ours, kind: extract metric view YAML, validate against the YAML spec 1.1 schema, parse expressions with sqlglot}
  repo-checks: {licence: ours, kind: built-in repository checks (what is missing, unpinned libraries, notebook installs); to move onto repo-review plugins in Tier 5}
  bundle-rules: {licence: ours, kind: bundle config rules CostLens lacks (tags, timeouts, worker limits, cluster autotermination)}
  sparkdoctor: {licence: Apache-2.0, kind: PySpark lint with JSON output; adopted after the trial on the sample (2 Nov 2026), mapped rules only}
  pyspark-antipattern: {licence: MIT, kind: PySpark lint; only S011 and F019 adopted (others overlap or are opinions that hit traps)}
  test-kit: {licence: ours, kind: standard case tables for known data patterns (SCD2, dedupe, incremental, late data)}
  pip-licenses: {licence: MIT, kind: licence list}
  coverage: {licence: Apache-2.0, kind: coverage.py with pytest-cov and diff-cover}
  mutmut: {licence: BSD-3-Clause, kind: mutation testing}
  import-linter: {licence: BSD-2-Clause, kind: architecture rules}
  repo-review: {licence: BSD-3-Clause, kind: repository checks, with sp-repo-review and our plugins}
  scorecard: {licence: Apache-2.0, kind: OpenSSF Scorecard}
  bundle-validate: {licence: Databricks CLI, kind: databricks bundle validate}
  costlens: {licence: Apache-2.0 oss-core, kind: cost rules for SQL, Python, plans and bundles; optional adapter}
  plan-harness: {licence: ours, kind: empty-table EXPLAIN on local PySpark}
  purity: {licence: ours, kind: purity classifier over Python syntax trees (src/shiftleft/purity.py), joined with the tests folder; test-time guard in Tier 5}
  shiftleft-tests: {licence: ours, kind: rules over test files and coverage data}

checks:
  # ---- cost in code and query text
  SL-COST-CODE-01: {tool: costlens, rules: [to_pandas_without_limit], status: cost, note: "collect() without limit is a build gap in costlens; add an Opengrep rule"}
  SL-COST-CODE-02: {tool: costlens, rules: [loop_calling_spark_sql, loop_calling_spark_read, code_spark_action_inside_loop], status: cost}
  SL-COST-CODE-03: {tool: costlens, rules: [collect_in_for_loop], status: cost}
  SL-COST-CODE-04: {tool: sparkdoctor, rules: [SDK005], status: adopt, note: "flags every Python UDF; the catalog check is narrower (a built-in exists). Trial result 2 Nov 2026"}
  SL-COST-CODE-05: {tool: sparkdoctor, rules: [SDK004], status: adopt, note: "pyspark-antipattern L003 and cylint CY003 do the same"}
  SL-COST-CODE-06: {tool: sparkdoctor, rules: [SDK003], status: adopt}
  SL-COST-CODE-07: {tool: costlens, rules: [code_persist_without_unpersist], status: cost}
  SL-COST-CODE-08: {tool: costlens, rules: [multi_read_same_table], status: cost}
  SL-COST-CODE-09: {tool: costlens, rules: [code_hardcoded_repartition_debug_value], status: cost, note: "covers repartition(1)/coalesce(1)"}
  SL-COST-CODE-10: {tool: costlens, rules: [broadcast_in_loop], status: cost}
  SL-COST-CODE-11: {tool: costlens, rules: [code_spark_action_result_discarded], status: cost, note: "show(), display(), count() whose result is unused"}
  SL-COST-CODE-12: {tool: pyspark-antipattern, rules: [F019], status: adopt, note: "costlens auto_loader_inferred_schema_no_location covers Auto Loader"}
  SL-COST-CODE-13: {tool: sqlfluff, rules: [AM04], status: adopt, note: "AM04 knows the columns of a CTE; costlens select_star flags every SELECT * (false alarm on the sample, run 2), so it is not mapped"}
  SL-COST-CODE-14: {tool: costlens, rules: [cross_join], status: cost, note: "sqlfluff AM05 (implicit or explicit join type) helps too"}
  SL-COST-CODE-15: {tool: costlens, rules: [function_on_partition_column, implicit_type_cast_on_filter, non_sargable_predicate], status: cost}
  SL-COST-CODE-16: {tool: costlens, rules: [merge_without_partition_predicate], status: cost}
  SL-COST-CODE-17: {tool: costlens, rules: [ordering_without_limit], status: cost}
  SL-COST-CODE-18: {tool: costlens, rules: [union_instead_of_union_all], status: cost}
  SL-COST-CODE-19: {tool: costlens, rules: [not_in_with_subquery], status: cost}
  SL-COST-CODE-20: {tool: costlens, rules: [delete_without_where, update_without_where], status: cost}
  SL-COST-CODE-21: {tool: costlens, rules: [nondeterministic_function_in_filter], status: cost}
  # ---- cost in the plan (EXPLAIN on empty DataFrames with real schemas)
  SL-COST-PLAN-01: {tool: plan-harness, rules: [CartesianProduct], status: build, note: "checked on Spark 3.5.1, 2 Nov 2026: a keyless join on empty inputs plans as CartesianProduct"}
  SL-COST-PLAN-02: {tool: plan-harness, rules: [BroadcastNestedLoopJoin], status: build}
  SL-COST-PLAN-03: {tool: plan-harness, rules: [BatchEvalPython, ArrowEvalPython], status: build}
  SL-COST-PLAN-04: {tool: costlens, rules: [predicate_pushdown_gap], status: cost, note: "reads PushedFilters / PartitionFilters on the Scan node"}
  SL-COST-PLAN-05: {tool: costlens, rules: [wide_stage_count], status: cost}
  SL-COST-PLAN-06: {tool: plan-harness, rules: [repeated-scan], status: build, note: "costlens repeated_table_scan works on SQL text; this is the plan-level version"}
  # ---- cost in job and compute config (databricks.yml, resources/*.yml)
  SL-COST-CONFIG-01: {tool: costlens, rules: [cluster_no_autotermination], status: cost, note: "bundle-rules also checks resources.clusters (cluster-no-autotermination)"}
  SL-COST-CONFIG-02: {tool: costlens, rules: [job_on_existing_cluster], status: cost}
  SL-COST-CONFIG-03: {tool: bundle-rules, rules: [job-no-tags, cluster-no-tags], status: build}
  SL-COST-CONFIG-04: {tool: costlens, rules: [oversized_autoscale_max], status: cost, note: "bundle-rules also flags autoscale with no max_workers (autoscale-no-max)"}
  SL-COST-CONFIG-05: {tool: costlens, rules: [dlt_continuous_for_batch_workload], status: cost}
  SL-COST-CONFIG-06: {tool: costlens, rules: [cron_too_frequent], status: cost, note: "sqlglot mv-schedule covers materialized views; needs the freshness target from the data contract to be exact"}
  SL-COST-CONFIG-07: {tool: repo-review, rules: [sl-dab-dev-target-size], status: build, note: "compare targets.dev overrides with targets.prod"}
  SL-COST-CONFIG-08: {tool: bundle-rules, rules: [job-no-timeout], status: build}
  # ---- unsafe code
  SL-SEC-01: {tool: ruff, rules: [S608], status: adopt, note: "plus an Opengrep rule for spark.sql(f'...'); fix is spark.sql(query, args={...}) (PySpark 3.4+)"}
  SL-SEC-02: {tool: ruff, rules: [S307, S102], status: adopt}
  SL-SEC-03: {tool: ruff, rules: [S301, S506], status: adopt, note: "pickle, unsafe yaml.load"}
  SL-SEC-04: {tool: ruff, rules: [S501, S323], status: adopt}
  SL-SEC-05: {tool: ruff, rules: [S602, S605], status: adopt}
  SL-SEC-06: {tool: opengrep, rules: [sl-secret-printed], status: build, note: "print/log of dbutils.secrets.get(...)"}
  SL-SEC-07: {tool: opengrep, rules: [sl-pii-sample-logged], status: build, note: "show()/display() on tables whose columns are tagged personal in the contract; report only, noisy by nature"}
  SL-SEC-08: {tool: sqlglot, rules: [grant-broad], status: build, note: "GRANT ALL PRIVILEGES, or GRANT to `account users` / `users`; also inside %sql cells"}
  # ---- secrets
  SL-SECRET-01: {tool: gitleaks, rules: [gitleaks default rules, sl-databricks-pat], status: adopt, note: "add a rule for Databricks tokens (dapi...) if the default set lacks one"}
  SL-SECRET-02: {tool: gitleaks, rules: [git history scan], status: adopt}
  SL-SECRET-03: {tool: opengrep, rules: [sl-credential-in-config], status: build, note: "password/token keys with literal values in *.yml, *.json, *.conf; allow {{secrets/scope/key}} references"}
  # ---- dependencies
  SL-DEP-01: {tool: osv-scanner, rules: [OSV database, lockfile scan], status: adopt, note: "pip-audit as fallback for repos with no lockfile"}
  SL-DEP-02: {tool: repo-checks, rules: [unpinned], status: build, note: "requirements lines without ==, and no lockfile"}
  SL-DEP-03: {tool: pip-licenses, rules: [allow-list], status: trial}
  SL-DEP-04: {tool: repo-review, rules: [sl-unmaintained-dependency], status: build, note: "last release date from the PyPI JSON API"}
  SL-DEP-05: {tool: repo-review, rules: [sl-runtime-match], status: build, note: "compare test pins (pyspark, python) with spark_version in databricks.yml, using the Databricks Runtime release notes table"}
  # ---- purity
  SL-PURE-01: {tool: purity, rules: [classify], status: build}
  SL-PURE-02: {tool: purity, rules: [could-be-pure], status: build}
  SL-PURE-03: {tool: purity, rules: [non-repeatable-in-logic], status: build}
  SL-PURE-04: {tool: import-linter, rules: [layers contract], status: adopt, note: "the team declares logic vs io modules in .importlinter"}
  SL-PURE-05: {tool: purity, rules: [false-pure-mark], status: build, note: "deal's @deal.pure marker is accepted as the mark"}
  SL-PURE-06: {tool: purity, rules: [action-in-logic], status: build}
  SL-PURE-07: {tool: purity, rules: [global-session], status: build, note: "databricks-labs-pylint C8915 spark-outside-function is similar; not adopted (pylint, last release 2024)"}
  # ---- tests
  SL-TEST-01: {tool: coverage, rules: [diff-cover --fail-under=80], status: adopt}
  SL-TEST-02: {tool: shiftleft-tests, rules: [pure-untested], status: build, note: "join of the purity report with coverage contexts"}
  SL-TEST-03: {tool: repo-review, rules: [sl-test-file-per-module], status: build}
  SL-TEST-04: {tool: shiftleft-tests, rules: [offline-tests], status: build, note: "run unit tests with network blocked (pytest-socket) and a local[1] session"}
  SL-TEST-05: {tool: mutmut, rules: [mutation score], status: adopt, note: "limited to pure functions via the purity report"}
  SL-TEST-06: {tool: opengrep, rules: [sl-test-count-only], status: build, note: "test functions whose only assertion is on count()"}
  # ---- complexity
  SL-CPLX-01: {tool: ruff, rules: [C901], status: adopt}
  SL-CPLX-02: {tool: complexipy, rules: [cognitive complexity], status: adopt}
  SL-CPLX-03: {tool: ruff, rules: [PLR0915], status: adopt}
  SL-CPLX-04: {tool: vulture, rules: [unused function, unused class, unreachable code], status: adopt, note: "run 1 (2 Nov): 28 findings, 1 planted; a library's public functions look unused because jobs call them from config. Nightly report until entry points are read from databricks.yml (SL-058)"}
  SL-CPLX-05: {tool: pylint, rules: [R0801], status: trial, note: "or jscpd; pick on the sample"}
  # ---- clean code
  SL-CLEAN-01: {tool: ruff, rules: [RET505, RET506, RET507, RET508, SIM102, PLR1702], status: adopt, note: "checked 2 Nov 2026: RET505 fires on the nested discount example"}
  SL-CLEAN-02: {tool: ruff, rules: [PLR0913], status: adopt}
  SL-CLEAN-03: {tool: ruff, rules: [B006], status: adopt}
  SL-CLEAN-04: {tool: ruff, rules: [E722, BLE001, S110, S112], status: adopt}
  SL-CLEAN-05: {tool: ruff, rules: [ERA001], status: adopt}
  SL-CLEAN-06: {tool: ruff, rules: [ARG001, ARG002, F401], status: adopt}
  SL-CLEAN-07: {tool: ruff, rules: [PLR2004], status: adopt, note: "noisy; report only"}
  SL-CLEAN-08: {tool: repo-review, rules: [sl-thin-notebooks], status: build, note: "share of function definitions in notebooks vs modules"}
  # ---- added in 0.2.0
  SL-COST-CODE-22: {tool: sqlglot, rules: [sl-mv-nondeterministic], status: build, note: "rand(), uuid() and similar in the MV query; time functions allowed only in WHERE per the incremental-refresh docs (checked 2 Nov 2026)"}
  SL-COST-CODE-23: {tool: sqlglot, rules: [sl-mv-chain-depth], status: build}
  SL-COST-CONFIG-09: {tool: mv-explain, rules: [EXPLAIN CREATE MATERIALIZED VIEW], status: adopt, note: "not offline: a few seconds on a dev warehouse before deploy. sqlglot mv-not-incremental gives the offline early warning"}
  SL-COST-CONFIG-10: {tool: repo-review, rules: [sl-mv-strict-policy-in-dev], status: build, note: "REFRESH POLICY INCREMENTAL STRICT in the dev target"}
  SL-SEC-09: {tool: nbstripout, rules: [--verify], status: adopt}
  SL-SEC-10: {tool: ruff, rules: [S], status: adopt, note: "every S rule not mapped to SL-SEC-01..05 (see ruff_map)"}
  SL-DEP-06: {tool: repo-checks, rules: [pip-in-notebook], status: build, note: "%pip install / MAGIC %pip without ==version"}
  SL-TEST-07: {tool: dbt-bouncer, rules: [check_model_has_unique_test], status: adopt, note: "check name to confirm against dbt-bouncer docs in Tier 3"}
  SL-TEST-08: {tool: dbt-bouncer, rules: [check_model_has_unit_tests], status: adopt, note: "check name to confirm in Tier 3"}
  SL-TEST-09: {tool: test-kit, rules: [scd2, dedupe, incremental, late-data], status: build}
  SL-CPLX-06: {tool: ruff, rules: [PLR0911, PLR0912], status: adopt}
  SL-CPLX-07: {tool: sqlglot, rules: [sl-sql-complexity], status: build, note: "costlens excessive_joins, nested_subqueries_excessive, excessive_query_size cover part of it"}
  SL-CPLX-08: {tool: pylint, rules: [C0302], status: trial}
  SL-CLEAN-09: {tool: ruff, rules: [ANN], status: adopt}
  SL-CLEAN-10: {tool: ruff, rules: [D], status: adopt, note: "public functions and modules only (D100-D104)"}
  SL-CLEAN-11: {tool: ruff, rules: [FBT], status: adopt}
  SL-CLEAN-12: {tool: ruff, rules: [SIM, C4, UP, FURB, PERF, PIE], status: adopt}
  SL-CLEAN-13: {tool: ruff, rules: [RET501, RET502, RET503], status: adopt}
  SL-CLEAN-14: {tool: opengrep, rules: [sl-df-attribute-column], status: build, note: "Palantir PySpark style guide; trial linters may already have it"}
  SL-CLEAN-15: {tool: ruff, rules: [F403, F405, A001, A002], status: adopt, note: "from pyspark.sql.functions import * shadows sum, max, min, filter, round, abs"}
  SL-CLEAN-16: {tool: ruff, rules: [DTZ], status: adopt}
  SL-CLEAN-17: {tool: ruff, rules: [T20, LOG, G], status: adopt}
  SL-CLEAN-18: {tool: ruff, rules: [PTH], status: adopt}
  SL-CLEAN-19: {tool: ruff, rules: [TRY, EM, RSE, B904], status: adopt}
  SL-CLEAN-20: {tool: ruff, rules: [B, RUF, PLE, PLW, PLC, SLF], status: adopt, note: "every rule in these groups not mapped to a more specific check"}
  SL-CLEAN-21: {tool: ruff, rules: [PT], status: adopt}
  SL-CLEAN-22: {tool: ruff, rules: [PD, NPY], status: adopt}
  SL-CLEAN-23: {tool: opengrep, rules: [sl-notebook-run-chain], status: build, note: "%run and dbutils.notebook.run used to pull in definitions"}
  SL-CLEAN-24: {tool: ruff, rules: [FIX, TD], status: adopt}
  SL-CLEAN-25: {tool: sparkdoctor, rules: [SDK009], status: adopt}
  SL-CLEAN-26: {tool: opengrep, rules: [sl-inline-complex-condition], status: build, note: "Palantir PySpark style guide"}
  SL-CLEAN-27: {tool: dbt-bouncer, rules: [check_model_has_no_hardcoded_references], status: adopt, note: "or dbt-project-evaluator fct_hard_coded_references; confirm in Tier 3"}
  SL-CLEAN-28: {tool: dbt-project-evaluator, rules: [fct_direct_join_to_source, fct_marts_or_intermediate_dependent_on_source, fct_staging_dependent_on_staging], status: trial}
  SL-SETUP-10: {tool: dbt-score, rules: [has_description, columns_have_description], status: adopt}
  SL-SEM-01: {tool: metricview, rules: [yaml-schema-1.1, expression-parse], status: build, note: "YAML spec 1.1 per Databricks docs (checked 2 Nov 2026); dbt semantic models via dbt parse"}
  SL-SEM-02: {tool: metricview, rules: [measure-no-aggregate], status: build}
  SL-SEM-03: {tool: metricview, rules: [avg-of-ratio], status: build}
  SL-SEM-04: {tool: metricview, rules: [join-cardinality], status: build, note: "spec 1.1 cardinality field (Runtime 18.1+)"}
  SL-SEM-05: {tool: metricview, rules: [duplicate-metric-name], status: build}
  SL-SEM-06: {tool: metricview, rules: [missing-comment], status: build}
  SL-SEM-07: {tool: metricview, rules: [golden-rows], status: build, note: "rewrite each measure as GROUP BY on tiny local tables; to be proven"}
  # ---- style
  SL-STYLE-01: {tool: ruff, rules: [ruff format], status: adopt}
  SL-STYLE-02: {tool: ruff, rules: [F, E], status: adopt}
  SL-STYLE-03: {tool: sqlfluff, rules: [core rules, dialect databricks], status: adopt, note: "%sql cells and spark.sql strings extracted first (costlens inputs/notebook.py, inputs/python_source.py)"}
  SL-STYLE-04: {tool: ruff, rules: [N], status: adopt}
  # ---- setup
  SL-SETUP-01: {tool: repo-checks, rules: [sl-setup-01], status: build, note: "sp-repo-review PC100 does the same once repo-review is adopted"}
  SL-SETUP-02: {tool: repo-checks, rules: [sl-setup-02], status: build, note: "OpenSSF Scorecard CI-Tests too, on GitHub"}
  SL-SETUP-03: {tool: repo-checks, rules: [sl-setup-03], status: build}
  SL-SETUP-04: {tool: repo-checks, rules: [sl-setup-04], status: build}
  SL-SETUP-05: {tool: scorecard, rules: [Branch-Protection], status: adopt, note: "Scorecard is GitHub-first (partial GitLab, no Azure DevOps); OpenSSF Allstar can enforce it on GitHub"}
  SL-SETUP-06: {tool: repo-checks, rules: [sl-setup-06], status: build}
  SL-SETUP-07: {tool: repo-checks, rules: [sl-setup-07], status: build}
  SL-SETUP-08: {tool: repo-checks, rules: [sl-setup-08], status: build}
  SL-SETUP-09: {tool: scorecard, rules: [aggregate score], status: adopt}

# Ruff rule profiles (Ruff 0.17.3: 973 rules, 832 stable, counted 2 Nov 2026).
# starter = 404 stable rules, strict = 600. Day one runs starter, warn-only except the block list.
ruff_settings: templates/ruff.toml   # line length 120, Databricks notebook globals, N812 and E501 off, test-file ignores
ruff_profiles:
  starter: [F, E, W, I, B, C4, SIM, RET, UP, PERF, S, BLE, DTZ, N, ARG, T20, RUF, C90, A, PL, PT]
  strict: [F, E, W, I, B, C4, SIM, RET, UP, PERF, S, BLE, DTZ, N, ARG, T20, RUF, C90, A, PL, PT,
           FURB, TRY, PTH, ERA, LOG, G, PIE, ISC, FBT, EM, RSE, ANN, D, PD, NPY, ICN, TID, SLF, FIX, TD]

# SQLFluff rules that mean more than style. Everything else from SQLFluff is SL-STYLE-03.
sqlfluff_map:
  AM02: SL-COST-CODE-18     # bare UNION removes duplicates with a full shuffle
  AM04: SL-COST-CODE-13     # SELECT * (unknown number of result columns)
  AM08: SL-COST-CODE-14     # implicit cross join

# PySpark linters, adopted after the trial on the sample (tests/RESULTS.md, run 2). Rules not listed are ignored.
sparkdoctor_map:
  SDK002: SL-COST-CODE-01   # collect() without a limit
  SDK003: SL-COST-CODE-06   # count() to test emptiness
  SDK004: SL-COST-CODE-05   # withColumn() in a loop
  SDK005: SL-COST-CODE-04   # Python UDF
  SDK006: SL-COST-CODE-09   # repartition(1)
  SDK009: SL-CLEAN-25       # long transformation chain
  SDK012: SL-COST-CODE-01   # toPandas() without a limit
  SDK016: SL-COST-CODE-14   # crossJoin()
  SDK023: SL-COST-CODE-11   # show() left in code
  SDK026: SL-SEC-01         # spark.sql() with a dynamic string
  SDK031: SL-COST-CODE-03   # collect() inside a loop
pyspark_antipattern_map:
  S011: SL-COST-CODE-14     # DataFrame join with no condition
  F019: SL-COST-CODE-12     # inferSchema / mergeSchema

# Every Ruff finding is reported under one catalog check. Most specific match wins: full code, then prefix.
ruff_map:
  F: SL-STYLE-02
  F401: SL-CLEAN-06
  F403: SL-CLEAN-15
  F405: SL-CLEAN-15
