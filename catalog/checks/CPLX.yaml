- id: SL-CPLX-05
  status: draft
  since: 0.1.0
  title: Duplicated logic
  level: SHOULD
  statement: The same block of logic SHOULD NOT be copied into several places; it SHOULD live in one function.
  why: A tax rule was copied into four jobs; a rate change was applied to three of them.
  fix: Move the logic into one shared function and call it.
  stage: nightly
  gate: report
  found_by: static
  applies_to: [python, pyspark, notebook]
  cost_impact: null
  dac: []
  cites: []
  related: []
- id: SL-CPLX-06
  status: draft
  since: 0.2.0
  title: Too many branches or return points
  level: SHOULD
  statement: A function SHOULD NOT have more branches or return points than the thresholds in core/gates.yaml.
  why: A status-mapping function had 14 return points; a new status fell through to the wrong one.
  fix: Replace the branches with a lookup table, or split the function.
  stage: commit
  gate: warn
  found_by: static
  applies_to: [python, pyspark, notebook]
  cost_impact: null
  dac: []
  cites: []
  related: [SL-CPLX-01]
- id: SL-CPLX-07
  status: draft
  since: 0.2.0
  title: Query too complex
  level: SHOULD
  statement: A query SHOULD stay within the thresholds in core/gates.yaml for joins, nesting depth, conditional branches and common table expressions.
  why: A 400-line view with 14 joins and four levels of nested subqueries could not be changed without breaking another report.
  fix: Split it into named steps (views or models), each with one job.
  stage: commit
  gate: warn
  found_by: static
  applies_to: [sql, notebook, dbt, materialized-view, metric-view]
  cost_impact: medium
  dac: []
  cites: []
  related: [SL-CPLX-02]
- id: SL-CPLX-08
  status: draft
  since: 0.2.0
  title: File too long
  level: MAY
  statement: A module MAY be split when it grows past the line limit in core/gates.yaml.
  why: A 3,000-line utilities file held unrelated helpers; every change to it touched every job.
  fix: Split by purpose.
