# SL-SECRET: secrets in the repository.
- id: SL-SECRET-01
  status: draft
  since: 0.1.0
  title: Secret in a file
  level: MUST
  statement: Files in the repository MUST NOT contain secrets such as tokens, keys, passwords or connection strings with credentials.
  why: A personal access token in a notebook was pushed to a shared repository and used from outside the company within a day.
  fix: Remove it, revoke and rotate the secret, and read it from the secret store.
  stage: commit
  gate: block
  found_by: static
  applies_to: [repo]
  cost_impact: null
  dac: [REL-05]
  cites:
  - standard: CWE
    ref: CWE-798
  - standard: OWASP-TOP10
    ref: "A07:2021 Identification and Authentication Failures"
  related: [SL-SECRET-02, SL-SEC-06]
- id: SL-SECRET-02
  status: draft
  since: 0.1.0
  title: Secret in the repository history
  level: MUST
  statement: The repository's history MUST NOT contain secrets, even ones removed from current files.
  why: A key was deleted from the code in a later commit, but stayed readable in history for anyone who cloned the repository.
  fix: Revoke and rotate the secret. Rewriting history is optional once the secret is dead.
  stage: nightly
  gate: block
  found_by: static
  applies_to: [repo]
  cost_impact: null
  dac: [REL-05]
  cites:
  - standard: CWE
    ref: CWE-798
  related: [SL-SECRET-01]
- id: SL-SECRET-03
  status: draft
  since: 0.1.0
  title: Credentials in configuration instead of a secret reference
  level: MUST
  statement: Configuration files MUST refer to secrets by name in the secret store, never hold the secret value.
  why: Environment config files held database passwords "just for development", and the production file copied the pattern.
  fix: Replace values with secret references resolved at run time.
  stage: commit
  gate: block
  found_by: static
  applies_to: [bundle-config, dbt]
  cost_impact: null
  dac: [REL-04, REL-05]
  cites:
  - standard: CWE
    ref: CWE-798
  related: [SL-SECRET-01]
